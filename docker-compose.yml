# =============================================================================
# AntiochiaArchive — docker-compose.yml
#
#  antiochia-archive-web     →  Vite dev server  (port 5173)   — development
#  antiochia-archive-nginx   →  nginx production  (port 8080)   — production
#  antiochia-archive-backend →  Express API       (port 5000)
#
# Development:
#   docker compose up antiochia-archive-web antiochia-archive-backend
#
# Production (build + run):
#   docker compose up antiochia-archive-nginx antiochia-archive-backend --build
# =============================================================================

services:

  # ── Dev: Vite hot-reload server ───────────────────────────────────────────
  antiochia-archive-web:
    image: node:20-alpine
    container_name: antiochia-archive-web
    working_dir: /app
    # npm ci reads package-lock.json (read-only mount is fine) and does NOT write to it.
    # npm install would try to update the lockfile → EROFS on read-only bind mount.
    command: ["sh", "-c", "npm ci && npm run dev"]
    ports:
      - "5173:5173"
    volumes:
      - ./index.html:/app/index.html:ro
      - ./404.html:/app/404.html:ro
      - ./style.css:/app/style.css:ro
      - ./vite.config.js:/app/vite.config.js:ro
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
      # public/ contains lang.js (served as /lang.js by Vite publicDir)
      - ./public:/app/public:ro
      - ./pages:/app/pages:ro
      # Named volume keeps node_modules inside the container
      - antiochia_nodemodules:/app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_PROXY_TARGET=http://antiochia-archive-backend:5000
    restart: unless-stopped
    depends_on:
      - antiochia-archive-backend

  # ── Production: nginx serves dist/ — no Node, no Vite ────────────────────
  # Build runs inside the builder stage of Dockerfile; final image is nginx-only.
  antiochia-archive-nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: serve          # explicitly target the nginx stage
    image: antiochia-archive:nginx
    container_name: antiochia-archive-nginx
    ports:
      - "8080:8080"
    environment:
      - BACKEND_UPSTREAM=http://antiochia-archive-backend:5000
      # /archive-v2/ routing mode (see nginx/default.conf) —
      # "runtime-authoritative" (the image's own default; safe for every
      # deployment) always uses the backend's response as-is, with NO
      # static-file fallback, so an archived SQLite entity can never be
      # publicly resurrected from a stale static file. Set to
      # "deploy-authoritative" ONLY for a confirmed non-SQLite deployment
      # (this compose file's default V2_DATA_STORE=empty below qualifies,
      # since nothing can be archived at request time there) to restore
      # the original, faster, static-file-first request ordering.
      - ARCHIVE_V2_ROUTING_MODE=${ARCHIVE_V2_ROUTING_MODE:-runtime-authoritative}
    restart: unless-stopped
    depends_on:
      - antiochia-archive-backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Backend: Express + Nodemailer ─────────────────────────────────────────
  antiochia-archive-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: antiochia-archive:backend
    container_name: antiochia-archive-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      # Local Compose intentionally uses file storage. Cloud Run must set DATA_STORE=firestore.
      - DATA_STORE=${DATA_STORE:-file}
      - ARCHIVE_JSON_PATH=/appdata/private/archive.json
      - SUBMISSIONS_JSON_PATH=/appdata/private/submissions.json
      - MAIL_MODE=${MAIL_MODE:-mock}
      # v2 stays on the safe empty store unless a developer explicitly opts in, e.g.:
      #   V2_DATA_STORE=local docker compose up antiochia-archive-web antiochia-archive-backend
      # See V2-ARCHITECTURE.md "Local real-data v2 runtime" / "Production v2 data path".
      # `local` is also the strategy Cloud Run production now uses (as of the
      # canonical v2 archive frontend integration) — there it reads a
      # committed, drift-checked JSON bundle baked into the image
      # (backend/data/, see backend/Dockerfile) instead of this bind mount,
      # via different V2_*_JSON_PATH values set directly in the Cloud Run
      # deploy command (see V1-RELEASE.md). Compose's default stays `empty`
      # here only because most local dev work doesn't need v2 data loaded.
      - V2_DATA_STORE=${V2_DATA_STORE:-empty}
      # Only read when V2_DATA_STORE=local; mirrors ARCHIVE_JSON_PATH above so the
      # container's mounted ./data volume (not the image's /app/data, which doesn't
      # exist) is where the local v2 native data files are read from.
      - V2_ENTITIES_JSON_PATH=/appdata/private/v2/entities.json
      - V2_RELATIONSHIPS_JSON_PATH=/appdata/private/v2/relationships.json
      - V2_LEGACY_REPLACEMENTS_JSON_PATH=/appdata/private/v2/legacyReplacements.json
    volumes:
      # Temporary local/development persistence only. Cloud Run uses Firestore.
      - ./data:/appdata/private
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health',(r)=>process.exit(r.statusCode===200?0:1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  antiochia_nodemodules:
