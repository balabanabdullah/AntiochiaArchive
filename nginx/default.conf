server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    error_page 404 /404.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 256;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;

    location /api/ {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        # Required when BACKEND_UPSTREAM is an HTTPS Cloud Run hostname.
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
        # add_header directives do not inherit when a location defines its own.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
    }

    # Clean /admin/ route for the admin/editorial panel (built to
    # dist/pages/admin.html — see vite.config.js's rollupOptions.input).
    # try_files here serves that file's bytes directly at /admin/, so a
    # fresh navigation OR a hard refresh on /admin/ both resolve without a
    # redirect and without ever 404ing. /pages/admin.html keeps working
    # too (matched by the generic *.html location below) — this only adds
    # the clean alias, it does not replace the old path.
    location = /admin {
        # Cloud Run terminates TLS at its own proxy and forwards to this
        # container over plain HTTP on the internal container port — nginx's
        # default absolute_redirect would build the Location header from
        # ITS OWN view of scheme/port ($scheme://$host:$server_port), i.e.
        # a broken "http://host:8080/admin/" that no external client can
        # reach, rather than the https://host/admin/ the real client used.
        # A relative Location (absolute_redirect off) lets the browser
        # resolve it against the actual request URL instead.
        absolute_redirect off;
        return 301 /admin/;
    }
    location = /admin/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
        try_files /pages/admin.html =404;
    }

    location = /health {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dynamic, no-code CMS pages (backend/pages/pageRoutes.js +
    # pageRenderer.js) — only meaningful once the backend is running
    # V2_DATA_STORE=sqlite; harmless (a clean 404 per page) otherwise. This
    # is the ONE piece of frontend infrastructure that must be deployed
    # before "no rebuild needed to publish a page" is true end-to-end — see
    # the "no-code CMS" round's report. Proxied exactly like /api/, so the
    # backend renders full HTML with real SEO tags per request; nothing
    # here is a static file this container ever serves itself.
    location /sayfa/ {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
    }

    # Vite-generated hashed assets may be cached permanently.
    location /assets/ {
        try_files $uri =404;
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # add_header directives do not inherit when a location defines its own.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
        access_log off;
    }

    # Runtime cultural-entity detail routing (Section 1-3 of the "no-code
    # CMS hard-requirement" round; routing MODE corrected in the
    # "release-blocker" round's Section 1-3 — see below for the exact bug
    # that was fixed).
    #
    # ARCHIVE_V2_ROUTING_MODE selects between two fundamentally different
    # request orderings, because "correct" and "efficient" pull in opposite
    # directions depending on whether this deployment's backend is actually
    # SQLite-authoritative:
    #
    #   runtime-authoritative (the default — safe for every deployment,
    #     including one this config has no way to know the mode of):
    #     EVERY request goes to v2/routes/v2DetailRoutes.js and the
    #     backend's response — 200 or 404 — is returned to the client AS
    #     IS. There is NO static-file fallback of any kind. This is a
    #     correctness FIX, not a tuning knob: a previous version of this
    #     block fell back to the static file whenever the backend
    #     returned 404, which could not distinguish "unknown slug" from
    #     "this exact entity exists in SQLite but is draft/inReview/
    #     archived" — an admin archiving a published entity that ALSO had
    #     a pre-existing static file (e.g. imported from the canonical
    #     JSON dataset) would see the backend correctly 404, nginx catch
    #     that 404, and serve the stale static file with a 200 — publicly
    #     resurrecting archived content. See
    #     backend/test/v2/routes/v2DetailRoutes.test.js and
    #     test/nginx-archive-v2-routing.test.js for the regression test.
    #
    #   deploy-authoritative: the ORIGINAL, pre-"no-code-CMS" behavior —
    #     nginx serves the pre-built static file directly whenever one
    #     exists, falling back to the backend (@archive_v2_backend_fallback)
    #     only when it doesn't. Safe ONLY for a deployment where
    #     V2_DATA_STORE is NOT sqlite (local/firestore/memory) — those
    #     stores' data is fixed per-deploy, so an admin can never archive
    #     anything at request time and "resurrecting" a stale file is not
    #     possible. Restores the original request-time performance (no
    #     backend round-trip for the overwhelmingly common case of an
    #     entity that already has a static page).
    #
    # `backend-first`/`static-first` (this round's predecessor's names) are
    # still accepted as aliases for `runtime-authoritative`/
    # `deploy-authoritative` respectively — see
    # nginx/10-select-archive-v2-mode.sh — but the NEW names are what this
    # file and its documentation use, because "backend-first" no longer
    # accurately describes the runtime mode: there is no longer a second
    # step to be "first" before. Set via the ARCHIVE_V2_ROUTING_MODE
    # environment variable at deploy time (docker-compose.yml / Cloud Run
    # env vars) — never guessed from request content. No second canonical
    # URL is introduced by either mode: both serve the exact same
    # /archive-v2/<slug>/ path the static generator already writes to.
    #
    # IMPLEMENTATION NOTE: the mode can't be a runtime
    # `if ($archive_v2_mode = ...)` inside the location block — nginx
    # flatly rejects `try_files` inside an `if` ("try_files directive is
    # not allowed here"), and try_files also cannot take a variable as its
    # named-location fallback. So the choice is made once, at CONTAINER
    # STARTUP, by nginx/10-select-archive-v2-mode.sh (a docker-entrypoint.d
    # script that deletes whichever of the two marker-delimited blocks
    # below was NOT selected, before nginx's own envsubst-on-templates step
    # runs) — see that script and the Dockerfile line that installs it.
    # Exactly one of the two blocks below survives into the actual served
    # config.
    # ARCHIVE_V2_MODE_RUNTIME_AUTHORITATIVE_START
    location /archive-v2/ {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
    }
    # ARCHIVE_V2_MODE_RUNTIME_AUTHORITATIVE_END
    # ARCHIVE_V2_MODE_DEPLOY_AUTHORITATIVE_START
    location /archive-v2/ {
        try_files $uri $uri/index.html @archive_v2_backend_fallback;
    }
    location @archive_v2_backend_fallback {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
    }
    # ARCHIVE_V2_MODE_DEPLOY_AUTHORITATIVE_END

    # Controlled local media serving (Section 11) — proxied like /api/,
    # never served as a static directory by this container.
    location /media/ {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # Runtime sitemap (Section 6/7) — see v2/render/runtimeSitemap.js. The
    # static /sitemap.xml below no longer carries any cultural-entity or CMS
    # page URLs at all (fixed a staleness bug this round — see that file's
    # header); this and /sitemap-index.xml are the two ADDITIONAL, live urls
    # that do.
    location = /sitemap-runtime.xml {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    location = /sitemap-index.xml {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # Reviewed image derivatives use stable descriptive filenames. Cache them
    # for a month, but do not mark them immutable so replacements can age out.
    location /images/ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # Stable filenames and mutable JSON must always revalidate.
    location = /script.js {
        try_files $uri =404;
        expires -1;
    }

    location = /lang.js {
        try_files $uri =404;
        expires -1;
    }

    location = /archive-api.js {
        try_files $uri =404;
        expires -1;
    }

    location = /archive-v2-api.js {
        try_files $uri =404;
        expires -1;
    }

    location = /admin-api.js {
        try_files $uri =404;
        expires -1;
    }

    location = /admin-archive.js {
        try_files $uri =404;
        expires -1;
    }

    location ~* \.json$ {
        try_files $uri =404;
        expires -1;
    }

    location ~* \.html$ {
        try_files $uri =404;
        expires -1;
    }

    location = /404.html {
        internal;
        expires -1;
    }

    # True MPA behavior: serve existing paths and return 404 for unknown routes.
    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
