server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 256;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location /api/ {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        # Required when BACKEND_UPSTREAM is an HTTPS Cloud Run hostname.
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite-generated hashed assets may be cached permanently.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Stable filenames and mutable JSON must always revalidate.
    location = /script.js {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-cache";
    }

    location = /lang.js {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-cache";
    }

    location = /admin-api.js {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-cache";
    }

    location ~* \.json$ {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-cache";
    }

    location ~* \.html$ {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # True MPA behavior: serve existing paths and return 404 for unknown routes.
    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
