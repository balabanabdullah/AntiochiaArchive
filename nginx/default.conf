server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    error_page 404 /404.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 256;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;

    location /api/ {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        # Required when BACKEND_UPSTREAM is an HTTPS Cloud Run hostname.
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
        # add_header directives do not inherit when a location defines its own.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
    }

    # Clean /admin/ route for the admin/editorial panel (built to
    # dist/pages/admin.html — see vite.config.js's rollupOptions.input).
    # try_files here serves that file's bytes directly at /admin/, so a
    # fresh navigation OR a hard refresh on /admin/ both resolve without a
    # redirect and without ever 404ing. /pages/admin.html keeps working
    # too (matched by the generic *.html location below) — this only adds
    # the clean alias, it does not replace the old path.
    location = /admin {
        return 301 /admin/;
    }
    location = /admin/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
        try_files /pages/admin.html =404;
    }

    location = /health {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite-generated hashed assets may be cached permanently.
    location /assets/ {
        try_files $uri =404;
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # add_header directives do not inherit when a location defines its own.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
        access_log off;
    }

    # Reviewed image derivatives use stable descriptive filenames. Cache them
    # for a month, but do not mark them immutable so replacements can age out.
    location /images/ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # Stable filenames and mutable JSON must always revalidate.
    location = /script.js {
        try_files $uri =404;
        expires -1;
    }

    location = /lang.js {
        try_files $uri =404;
        expires -1;
    }

    location = /archive-api.js {
        try_files $uri =404;
        expires -1;
    }

    location = /archive-v2-api.js {
        try_files $uri =404;
        expires -1;
    }

    location = /admin-api.js {
        try_files $uri =404;
        expires -1;
    }

    location = /admin-archive.js {
        try_files $uri =404;
        expires -1;
    }

    location ~* \.json$ {
        try_files $uri =404;
        expires -1;
    }

    location ~* \.html$ {
        try_files $uri =404;
        expires -1;
    }

    location = /404.html {
        internal;
        expires -1;
    }

    # True MPA behavior: serve existing paths and return 404 for unknown routes.
    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
