server {
    listen       80;
    server_name  localhost;

    # ── Kök dizin ve varsayılan dosya ─────────────────────────────────────────
    root  /usr/share/nginx/html;
    index index.html;

    # ── Charset ───────────────────────────────────────────────────────────────
    charset utf-8;

    # ── Gzip sıkıştırma ───────────────────────────────────────────────────────
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json;
    gzip_min_length 256;

    # ── Statik varlıklar için cache başlıkları ────────────────────────────────
    location ~* \.(css|js)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── SPA / tek sayfa uygulama: bulunamayan istekleri index.html'e yönlendir ─
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Gizli dosyalara (. ile başlayan) erişimi engelle ─────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Hata sayfaları ────────────────────────────────────────────────────────
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
